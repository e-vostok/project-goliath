# Конфигурация инструмента tools/map_pipeline (не баланс игры; схема — pipeline_config_schema.py).
# Все значения — в единицах исходного SVG (viewBox 1200x680; 1 единица ≈ 23 км / ≈0,3° долготы).
# Диапазоны заданы жёстко в схеме; неизвестные ключи запрещены.

# Шаг 2: очистка контуров — число точек на кривой сегмент и минимальная площадь осколка.
clean:
  sample_points_per_curve: 4    # допустимо 2..16
  min_part_area: 0.001          # кв. ед. SVG; допустимо 0..0.1

# Шаг 3: проверка обособленных кусков — буфер поиска соседей и минимальная площадь куска.
isolated:
  neighbour_buffer: 0.3         # допустимо 0.05..1.0
  min_part_area: 0.01           # кв. ед. SVG; допустимо 0..0.5

# MP-2: допуск общей границы и минимальная длина связи (формула 3.1 спецификации).
geometry:
  border_epsilon: 0.04          # допустимо 0.005..0.2
  min_border_length: 0.3        # допустимо 0.05..2.0

# MP-2: шаг растра для построения морских зон (пикселей на единицу SVG).
raster:
  pixels_per_unit: 4            # допустимо 1..16

# MP-2: радиус смещения морского «семени» на ближайший рабочий водный пиксель, ед. SVG.
sea:
  seed_snap_radius: 1.0         # допустимо 0.25..3.0

# MP-2: пороги отчёта graph_report.md.
report:
  land_degree_warn: 12          # предупреждение о числе соседей узла суши; допустимо 6..40
  small_area_warn: 0.1          # предупреждение о площади узла, кв. ед.; допустимо 0..2.0
  largest_lakes: 10             # сколько крупнейших озёр перечислять; допустимо 1..50

# MP-2/MP-3: масштаб картинки предпросмотра (пикселей на единицу SVG) и палитра.
# Цвета — точная копия умолчаний Spec 01_map Часть 4 (инструмент не читает configs/01_map.yaml).
preview:
  pixels_per_unit: 6            # допустимо 2..12
  crop_pixels_per_unit: 12      # детальные обрезки для ревью; допустимо 2..24
  colors:
    inland_water: "#3E6B84"     # фон под картой (внутренняя вода)
    outside: "#2A2A2A"          # «земли за краем»
    sea: "#1E3547"              # заливка морских зон
    land: "#8C8C8C"             # заливка провинций
    border: "#3A3A3A"           # обводка провинций
    sea_border: "#2C4A62"       # обводка морских зон

# MP-3: допуски упрощения контуров (суша — по узлам, моря — единым покрытием).
simplify:
  tolerance: 0.03               # суша и outside; допустимо 0.0..0.2
  small_part_factor: 0.012      # часть суши: tol = min(tolerance, factor·√area); 0.0..0.2
  sea_tolerance: 0.3            # морские зоны; допустимо 0.05..1.0

# MP-3 (map2_18): сглаживание контуров после упрощения, ДО морского среза,
# границ, хешей, якорей подписей и рельефных масок. Кольца режутся на цепи
# в якорях (стыки трёх+ регионов, концы границ на рамке, вершины патчей),
# ресэмплируются на step и фильтруются гауссианом sigma с закреплёнными
# концами; затем Douglas-Peucker post_tolerance. Общие границы соседей
# сглаживаются один раз как средняя линия и вставляются в обе стороны
# одинаково. Куски меньше small_part_area получают sigma·√(area/small_part_area)
# (не ниже 0.02). Пределы-стражи: max_area_change (относительно площади узла;
# островки — 4x) и max_displacement (хаусдорфово смещение контура узла).
smooth:
  enabled: true                # выключатель сглаживания; допустимо true/false
  sigma: 0.10                  # ширина гауссиана, ед. SVG; допустимо 0.02..0.5
  step: 0.03                   # шаг ресэмплинга цепей, ед. SVG; 0.01..0.2
  post_tolerance: 0.008        # Douglas-Peucker после фильтра; 0.001..0.05
  max_area_change: 0.02        # макс. относит. сдвиг площади узла; 0.001..0.2
  max_displacement: 0.12       # макс. смещение контура узла; допустимо 0.02..0.5
  small_part_area: 0.05        # кв. ед.; ниже — sigma масштабируется; 0..1.0
  anchor_gap: 0.05             # радиус закрепления якорей патчей; 0.01..0.3

# MP-3: ожидаемый корневой viewBox исходного SVG (расхождение — VIEWBOX_MISMATCH).
view:
  width: 1200                   # допустимо 100..4000
  height: 680                   # допустимо 100..4000

# MP-3: геопривязка (Spec 3.7), записывается в manifest.georef.
georef:
  x0: 562.53
  k: 3.339                      # ед./градус долготы; > 0
  y0: 353.34
  m: 459.3                      # > 0

# MP-3: координатная сетка итоговой геометрии, ед. SVG.
output:
  grid: 0.01                    # допустимо 0.001..0.1

# MP-3: на сколько пикселей растра метки морских зон заходят на сушу до векторизации;
# остатки воды (заливы, фьорды) не больше fill_max_area присоединяются к примыкающей зоне.
sea_cut:
  dilate_pixels: 2              # допустимо 1..4
  fill_max_area: 3.0            # кв. ед. SVG; 0 — отключает заливку; допустимо 0..20

# MP-3: контур outside — замыкание щелей, подлезание под узлы, минимальная дыра;
# окна-озёра делаются только для озёр в пределах lake_near_land от игровой суши.
outside:
  closing: 0.3                  # допустимо 0.01..0.5
  underlap: 0.05                # допустимо 0..0.2
  min_hole_area: 0.02           # кв. ед. SVG; допустимо 0..0.5
  lake_near_land: 0.2           # ед. SVG; допустимо 0..2

# MP-3 (map2_1B): канонические общие границы — полоса привязки eps, предел
# подтяжки концов к центру стыка junction_snap (больше — устье воды, линии
# не соединяются) и допуски покрытия периметра (warn — список в
# reference/borders_coverage.tsv, fail — сборка падает).
borders:
  eps: 0.12                   # полуширина полосы вокруг соседа; допустимо 0.02..0.5
  junction_snap: 0.15         # макс. сдвиг конца линии к центру стыка; допустимо 0..1.0
  coverage_warn: 0.005        # |покрытие-1| выше — узел в TSV-отчёт; допустимо 0.001..0.1
  coverage_fail: 0.02         # |покрытие-1| выше — ошибка сборки; допустимо 0.005..0.2

# MP-3 (map2_20): опорная линия («спина») подписи — хорда или пологая дуга,
# вписанная в территорию узла (доминантная часть по правилу 5 map2_6, иначе
# выпуклая оболочка группы). max_angle_deg и max_bend зеркалят labels.* —
# инструмент configs/01_map.yaml не читает.
spine:
  max_angle_deg: 60           # наклон хорды от горизонтали, градусы; допустимо 0..89
  angle_step_deg: 5           # шаг перебора направлений, градусы; допустимо 1..30
  offset_step: 0.05           # шаг параллельных смещений хорды, ед. SVG; допустимо 0.01..0.5
  max_bend: 0.10              # макс. стрелка дуги как доля длины хорды (пробуются 0, ±max/2, ±max); допустимо 0..0.25
  central_share: 0.8          # центральная доля хорды для замера толщины; допустимо 0.3..1.0
  thickness_samples: 7        # точек замера толщины по центральной доле; допустимо 3..15
  arc_samples: 33             # точек проверки «дуга целиком внутри»; допустимо 9..129

# MP-3: зеркало серверных лимитов (Spec Часть 4): инструмент не должен их превышать.
limits:
  max_nodes: 3000               # допустимо 100..20000
  max_edges_per_node: 60        # допустимо 4..100
  max_geometry_bytes: 5000000   # допустимо 100000..20000000
  max_manifest_bytes: 3000000   # допустимо 100000..20000000
  max_borders_bytes: 2000000    # допустимо 100000..5000000
