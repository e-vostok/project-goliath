# Конфигурация инструмента tools/map_pipeline (не баланс игры; схема — pipeline_config_schema.py).
# Все значения — в единицах исходного SVG (viewBox 1200x680; 1 единица ≈ 23 км / ≈0,3° долготы).
# Диапазоны заданы жёстко в схеме; неизвестные ключи запрещены.

# Шаг 2: очистка контуров — число точек на кривой сегмент и минимальная площадь осколка.
clean:
  sample_points_per_curve: 4    # допустимо 2..16
  min_part_area: 0.001          # кв. ед. SVG; допустимо 0..0.1

# Шаг 3: проверка обособленных кусков — буфер поиска соседей и минимальная площадь куска.
isolated:
  neighbour_buffer: 0.3         # допустимо 0.05..1.0
  min_part_area: 0.01           # кв. ед. SVG; допустимо 0..0.5

# MP-2: допуск общей границы и минимальная длина связи (формула 3.1 спецификации).
geometry:
  border_epsilon: 0.04          # допустимо 0.005..0.2
  min_border_length: 0.3        # допустимо 0.05..2.0

# MP-2: шаг растра для построения морских зон (пикселей на единицу SVG).
raster:
  pixels_per_unit: 4            # допустимо 1..16

# MP-2: радиус смещения морского «семени» на ближайший рабочий водный пиксель, ед. SVG.
sea:
  seed_snap_radius: 1.0         # допустимо 0.25..3.0

# MP-2: пороги отчёта graph_report.md.
report:
  land_degree_warn: 12          # предупреждение о числе соседей узла суши; допустимо 6..40
  small_area_warn: 0.1          # предупреждение о площади узла, кв. ед.; допустимо 0..2.0
  largest_lakes: 10             # сколько крупнейших озёр перечислять; допустимо 1..50

# MP-2: масштаб картинки предпросмотра (пикселей на единицу SVG).
preview:
  pixels_per_unit: 6            # допустимо 2..12

# MP-3: допуск упрощения контуров.
simplify:
  tolerance: 0.03               # допустимо 0.0..0.2
