<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проба входа в новую вкладку — отчёт</title>
<style>
  body {
    font-family: sans-serif;
    padding: 24px;
    max-width: 860px;
    margin: 0 auto;
    line-height: 1.5;
    background: #19191a;
    color: #e1e3e6;
  }
  h1 { font-size: 20px; }
  h2 { font-size: 16px; }
  textarea {
    width: 100%;
    min-height: 340px;
    font-family: monospace;
    font-size: 12px;
    box-sizing: border-box;
    padding: 8px;
    background: #232324;
    color: inherit;
    border: 1px solid #444;
    border-radius: 8px;
  }
  button { font-size: 15px; padding: 8px 16px; cursor: pointer; }
  .hint { color: #9ea4ad; font-size: 13px; }
</style>
</head>
<body>
<h1>Проба входа в новую вкладку — отчёт</h1>
<p class="hint">
  Временная служебная страница (версия 0.11.0, единица 1). Никаких
  запросов к серверу и ВК — страница только смотрит на своё окружение
  и собирает отчёт. Скопируйте текст ниже и пришлите в чат.
</p>
<p>
  <button type="button" id="copy">Скопировать отчёт</button>
  <span id="copy-hint" class="hint"></span>
</p>
<textarea id="report" readonly></textarea>

<script>
(function () {
  'use strict';

  var MARKER_KEY = 'pax.admin-probe.marker';
  var OWN_KEY = 'pax.admin-probe.own';

  function describeOpener() {
    try {
      if (window.opener === null || window.opener === undefined) {
        return 'null (связи с открывшим окном нет)';
      }
      var desc = 'объект есть';
      try {
        // Same-origin check: readable only if opener shares our origin.
        desc += ', opener.location.origin = ' + String(window.opener.location.origin);
      } catch (e) {
        desc += ', opener.location недоступен (' + e.name + ')';
      }
      return desc;
    } catch (e) {
      return 'ошибка чтения: ' + e.name;
    }
  }

  function readMarker(storageName) {
    try {
      var storage = window[storageName];
      var value = storage.getItem(MARKER_KEY);
      if (value === null) {
        return 'метки iframe не видно';
      }
      return 'метка iframe видна: "' + value + '"';
    } catch (e) {
      return 'недоступно (' + e.name + ')';
    }
  }

  function writeOwn(storageName) {
    try {
      var storage = window[storageName];
      storage.setItem(OWN_KEY, 'ok-' + Date.now());
      var back = storage.getItem(OWN_KEY);
      storage.removeItem(OWN_KEY);
      return back !== null ? 'можно писать' : 'запись не сохранилась';
    } catch (e) {
      return 'запрещено (' + e.name + ')';
    }
  }

  function buildReport() {
    var hash = window.location.hash;
    var lines = [
      'ОТЧЁТ ПРОБЫ — новая вкладка (временная страница, 0.11.0 единица 1)',
      'собран: ' + new Date().toISOString(),
      '',
      'location.href = ' + window.location.href,
      'location.hash = ' + (hash === '' ? '(пусто)' : hash) +
        ' — фрагмент ' + (hash.indexOf('#t=') === 0 ? 'СОХРАНЁН' : 'НЕ СОХРАНЁН'),
      'window.opener = ' + describeOpener(),
      'document.referrer = ' +
        (document.referrer === '' ? '(пусто)' : document.referrer),
      'navigator.cookieEnabled = ' + String(navigator.cookieEnabled),
      '',
      'localStorage iframe-метка: ' + readMarker('localStorage'),
      'sessionStorage iframe-метка: ' + readMarker('sessionStorage'),
      'localStorage своя запись: ' + writeOwn('localStorage'),
      'sessionStorage своя запись: ' + writeOwn('sessionStorage'),
      '',
      'window.innerWidth = ' + window.innerWidth,
      'window.innerHeight = ' + window.innerHeight,
      'document.fullscreenEnabled = ' + String(document.fullscreenEnabled),
      'navigator.userAgent = ' + navigator.userAgent,
    ];
    return lines.join('\n');
  }

  var textarea = document.getElementById('report');
  textarea.value = buildReport();

  document.getElementById('copy').addEventListener('click', function () {
    var hint = document.getElementById('copy-hint');
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textarea.value).then(
          function () { hint.textContent = 'Скопировано.'; },
          function () {
            textarea.focus();
            textarea.select();
            hint.textContent = 'Текст выделен — нажмите Ctrl+C.';
          }
        );
      } else {
        throw new Error('no clipboard');
      }
    } catch (e) {
      textarea.focus();
      textarea.select();
      hint.textContent = 'Текст выделен — нажмите Ctrl+C.';
    }
  });
})();
</script>
</body>
</html>
