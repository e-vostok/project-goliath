name: CI

# Public repo: no secrets are used anywhere in this workflow, and the
# trigger is deliberately `pull_request` (never `pull_request_target`),
# so a fork PR cannot run with elevated permissions or leaked context.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI-1: figure out which areas a change can affect and let each of the
  # four checks decide via `if:`. On `push` (main) or whenever the PR
  # diff cannot be computed every output stays `true` — fail-safe.
  # A required check skipped by `if:` counts as passing, so branch
  # protection keeps working while docs-only PRs skip everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      map_pipeline: ${{ steps.filter.outputs.map_pipeline }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected areas
        id: filter
        shell: bash
        run: |
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "${{ github.base_ref }}" 2>/dev/null || true
            files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null || true)"
          fi
          if [ -z "$files" ] || echo "$files" | grep -qE '^\.github/workflows/'; then
            echo "push event, empty/failed diff or workflow change: run everything"
            for a in backend frontend map_pipeline docker; do
              echo "$a=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          echo "Changed files:"
          echo "$files"
          echo "$files" | grep -qE '^(backend/|configs/|data/map/)' \
            && echo "backend=true" >> "$GITHUB_OUTPUT" \
            || echo "backend=false" >> "$GITHUB_OUTPUT"
          echo "$files" | grep -qE '^(frontend/|data/map/)' \
            && echo "frontend=true" >> "$GITHUB_OUTPUT" \
            || echo "frontend=false" >> "$GITHUB_OUTPUT"
          echo "$files" | grep -qE '^(tools/map_pipeline/|data/map/)' \
            && echo "map_pipeline=true" >> "$GITHUB_OUTPUT" \
            || echo "map_pipeline=false" >> "$GITHUB_OUTPUT"
          echo "$files" | grep -qE '^(deploy/|data/map/|backend/alembic/|backend/pyproject\.toml$|backend/requirements[^/]*\.lock$|frontend/package(-lock)?\.json$)|(^|/)(\.env\.prod\.example|\.dockerignore|Dockerfile|docker-compose[^/]*\.yml)$' \
            && echo "docker=true" >> "$GITHUB_OUTPUT" \
            || echo "docker=false" >> "$GITHUB_OUTPUT"

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: goliath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d goliath_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements-dev.lock

      # DEP-6a: the committed locks are the source of truth. Re-running
      # the same compile keeps the existing pins (uv prefers versions in
      # an existing output file), so the result may only differ when
      # pyproject.toml changed but the locks were not regenerated —
      # in that case fail here instead of testing a floating set.
      # Comments (headers, "# via" annotations) are ignored: uv does not
      # preserve the custom header on regeneration.
      - name: Lock freshness guard (uv pip compile)
        working-directory: backend
        run: |
          set -euo pipefail
          pip install uv
          cp requirements.lock /tmp/requirements.lock.committed
          cp requirements-dev.lock /tmp/requirements-dev.lock.committed
          uv pip compile pyproject.toml --python-version 3.12 --python-platform x86_64-manylinux_2_28 -o requirements.lock
          uv pip compile pyproject.toml --extra dev --python-version 3.12 --python-platform x86_64-manylinux_2_28 -o requirements-dev.lock
          failed=0
          for f in requirements.lock requirements-dev.lock; do
            if ! diff <(grep -vE '^[[:space:]]*(#|$)' "/tmp/$f.committed") <(grep -vE '^[[:space:]]*(#|$)' "$f"); then
              echo "::error file=backend/$f::$f is stale: pyproject.toml changed but the lock was not regenerated."
              echo "::error::Regenerate: cd backend && uv pip compile pyproject.toml --python-version 3.12 --python-platform x86_64-manylinux_2_28 -o $f (add --extra dev for requirements-dev.lock)"
              failed=1
            fi
          done
          exit "$failed"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]" -c requirements-dev.lock

      # Full suite in ONE run: SQLite unit tests, config validity,
      # migration drift and the destructive postgres-marked suite.
      # DATABASE_URL_TEST -> the service container; the database name
      # MUST end with `_test` and differ from DATABASE_URL's database
      # (assert_safe_test_db refuses otherwise). REQUIRE_POSTGRES_TESTS=1
      # turns "no test DB" into a failure instead of a silent skip.
      # DATABASE_URL is intentionally left unset: every test that needs
      # one sets it via monkeypatch.
      - name: pytest (full suite incl. postgres marker)
        working-directory: backend
        env:
          DATABASE_URL_TEST: postgresql+asyncpg://postgres:ci_postgres_password@localhost:5432/goliath_test
          REQUIRE_POSTGRES_TESTS: "1"
        run: pytest -v

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  map_pipeline:
    name: map_pipeline
    needs: changes
    if: needs.changes.outputs.map_pipeline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/map_pipeline/requirements.txt

      - run: pip install -r tools/map_pipeline/requirements.txt

      # Includes the `real_data` suite — it rebuilds geometry/graph from
      # the committed data/map inputs and verifies their checksums.
      # `python -m pytest` (not bare `pytest`): the tests import
      # `tools.map_pipeline`, so the repo root must be on sys.path.
      - name: pytest (incl. real_data)
        run: python -m pytest tools/map_pipeline/tests -v

  docker:
    name: docker
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # ENV_FILE redirects the services' `env_file:` (default `.env`,
      # which is gitignored and absent on the runner) at the existing
      # .env.prod.example. Values are placeholders — `config` only
      # validates structure, it never connects anywhere.
      - name: Validate compose file
        run: >
          ENV_FILE=.env.prod.example
          docker compose -f docker-compose.prod.yml
          --env-file .env.prod.example config

      # DEP-5: the ops scripts must be shellcheck-clean (warning level)
      # and syntactically valid before anything else uses them.
      - name: Lint deploy scripts (shellcheck + bash -n)
        run: |
          shellcheck -S warning deploy/*.sh
          for f in deploy/*.sh; do bash -n "$f"; done

      # DEP-6a: the image must contain exactly the locked set. Build it
      # explicitly (the smoke test's `up --build` then reuses the BuildKit
      # cache), freeze its site-packages and assert every requirements.lock
      # pin is installed at the same version. Names are normalised
      # PEP 503-style (case/underscore-insensitive).
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t goliath-backend .

      - name: Image parity guard (pip freeze == requirements.lock)
        run: |
          docker run --rm goliath-backend pip freeze > /tmp/image-freeze.txt
          python3 - <<'PY'
          import re, sys

          def norm(n):
              return re.sub(r"[-_.]+", "-", n).lower()

          def pins(path):
              out = {}
              for raw in open(path):
                  m = re.match(r"^([A-Za-z0-9][A-Za-z0-9._-]*)==([^\s]+)$", raw.strip())
                  if m:
                      out[norm(m.group(1))] = m.group(2)
              return out

          lock = pins("backend/requirements.lock")
          freeze = pins("/tmp/image-freeze.txt")
          problems = [f"MISSING in image: {n}=={lock[n]}" for n in sorted(set(lock) - set(freeze))]
          problems += [f"MISMATCH: {n} lock=={lock[n]} image=={freeze[n]}"
                       for n in sorted(lock) if n in freeze and freeze[n] != lock[n]]
          if problems:
              print("image/lock parity FAILED:")
              print("\n".join(problems))
              sys.exit(1)
          print(f"parity OK: all {len(lock)} locked pins present in the image "
                f"({len(freeze)} packages installed)")
          PY

      # First real runtime run of DEP-1: builds both images, boots the
      # stack on an empty database and asserts the wiring end-to-end.
      # The script itself prints every service's log tail on failure.
      - name: Stack smoke test (deploy/smoke_local.sh)
        run: bash deploy/smoke_local.sh

      # DEP-7b: the retired-nodes pre-deploy check must work in exactly
      # the form the runbook hands to the owner — `compose run` inside
      # the built backend image (WORKDIR /app/backend, no PYTHONPATH).
      # smoke_local.sh tears its stack down, so this step boots a
      # throwaway db, applies migrations and runs the report against
      # it. A freshly migrated schema has no retired rows, so the
      # expected verdict is exit 0 and "ГОТОВО ... удалено 0 строк":
      # the guard proves the command form, it does not reproduce
      # production data. `-T` replaces the interactive TTY the
      # production command gets over SSH.
      - name: Retired nodes pre-deploy check (retired_report)
        run: |
          set -euo pipefail
          ENV_FILE_PATH="$(mktemp)"
          PG_PW="$(openssl rand -hex 24)"
          cat > "$ENV_FILE_PATH" <<EOF
          POSTGRES_USER=goliath
          POSTGRES_DB=goliath
          POSTGRES_PASSWORD=$PG_PW
          DATABASE_URL=postgresql+asyncpg://goliath:$PG_PW@db:5432/goliath
          JWT_SECRET_KEY=$(openssl rand -hex 32)
          VK_APP_SECRET=ci_throwaway_vk_secret_0123456789
          ADMIN_VK_USER_IDS=
          DOMAIN=localhost
          ACME_EMAIL=smoke@example.invalid
          APP_ENV=production
          ADMIN_ALLOW_RESET=false
          EOF
          export ENV_FILE="$ENV_FILE_PATH"
          cleanup() {
            docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE_PATH" \
              down -v --remove-orphans >/dev/null 2>&1 || true
            rm -f "$ENV_FILE_PATH"
          }
          trap cleanup EXIT
          docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE_PATH" \
            up -d --wait db
          docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE_PATH" \
            run --rm --no-deps -T migrate
          docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE_PATH" \
            run --rm --no-deps -T backend \
            python -m src.modules._01_map.retired_report | tee /tmp/retired-report.txt
          grep -q "ГОТОВО" /tmp/retired-report.txt
