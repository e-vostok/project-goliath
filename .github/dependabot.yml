# Weekly dependency update PRs; the Project Owner batches and merges them
# once a month (version 0.14.0, unit 11).
#
# There is intentionally NO `pip` entry: backend/requirements*.lock are
# generated by `uv pip compile` and the CI lock-freshness guard fails on
# any drift, so Dependabot edits to Python dependencies would break CI.
# Python bumps go through a monthly TZ instead.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # Minor and patch bumps arrive as a single PR; majors stay ungrouped
    # and get one PR each.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # Images are pinned to the lines we chose (Node 24, Caddy 2); only
    # patch/minor moves are allowed, majors stay a deliberate decision.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "caddy"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # Python stays on the 3.12 line; Dependabot counts 3.12 -> 3.15 as a
    # minor step, so major AND minor are ignored and only patches arrive.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # A new Postgres major cannot open an existing data directory, so the
    # image may only move inside the 16.x line.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
