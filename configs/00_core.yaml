# configs/00_core.yaml
# Балансовые параметры модуля 00_core.
# Валидируется backend/src/modules/_00_core/config_schema.py при старте приложения и в CI.

tick:
  # Суточный тик в фиксированное локальное время (строгий формат HH:MM, 24ч).
  tick_time: "00:00"
  # IANA-зона для tick_time; должна резолвиться через zoneinfo.ZoneInfo.
  tick_timezone: "Europe/Moscow"
  # Наследие: используется только миграцией 0001 для посева первого
  # next_tick_at на свежей БД. Расписание тика задают tick_time/tick_timezone.
  tick_interval_hours: 24
  retry_delay_seconds: 60
  # Шаг ожидания планировщика: спит не дольше этого интервала, перечитывает
  # next_tick_at при каждом пробуждении и обновляет метку жизни для /api/v1/health.
  heartbeat_interval_seconds: 30
  # Порог «живости» планировщика для GET /api/v1/health: метка старше порога
  # даёт scheduler=stale. Должен быть больше retry_delay_seconds +
  # heartbeat_interval_seconds (при сбое БД метка отстаёт примерно на retry_delay).
  health_max_heartbeat_age_seconds: 180

auth:
  vk_ts_freshness_window_minutes: 30
  jwt_ttl_minutes: 60

admin_panel:
  # Одноразовая ссылка входа в панель администратора (версия 0.11.0, единица 4):
  # метка живёт только для передачи из Mini App в новую вкладку, секунды.
  link_ttl_seconds: 60
  # Срок жизни сеанса панели (обычный короткий Bearer JWT), минуты.
  session_ttl_minutes: 60
  # Сколько невостребованных ссылок хранилище держит на одного игрока;
  # сверх предела самая старая выбрасывается.
  max_pending_links_per_player: 3
  # Предел записей журнала администратора (admin_audit_log): при каждой
  # новой записи самые старые сверх предела удаляются автоматически —
  # таблица не может расти без границ. Вручную записи не удаляются.
  audit_log_max_rows: 5000

nation:
  # Полное название государства (решение Project Owner 20.10.2026,
  # расширено в версии 0.10.0: от 2 до 60).
  nation_name_min_length: 2
  nation_name_max_length: 60
  # Краткое название (обязательное, уникальное): от 2 до 20.
  short_name_min_length: 2
  short_name_max_length: 20
  # Стартовые провинции: ровно 5 (решение Project Owner 17.10.2026).
  # Ключи остаются двумя, чтобы позже число могло зависеть от бонусов.
  min_provinces_per_nation: 5
  max_provinces_per_nation: 5
  leader_name_min_length: 2
  leader_name_max_length: 60
  leader_title_min_length: 2
  leader_title_max_length: 60
  # Необязательные тексты: пустое значение допустимо, длина считается только сверху.
  motto_max_length: 50
  description_max_length: 150
  leader_bio_max_length: 500
  # Название столицы (обязательное; клиент подставляет название провинции из карты).
  capital_name_min_length: 2
  capital_name_max_length: 40
  history_url_max_length: 200
  # Допустимые хосты ссылки на историю государства (нижний регистр, без схемы и пути).
  # m.vk.com добавлен по итогам NAT-0 (N7): мобильная копия адреса статьи.
  history_url_allowed_hosts:
    - "vk.com"
    - "vk.ru"
    - "m.vk.com"
  # Необязательная ссылка на гимн (трек или плейлист ВК). Проверяются только
  # https, хост и длина: формат ссылок на музыку ВК не подтверждён (NAT-0, N4).
  anthem_url_max_length: 200
  anthem_url_allowed_hosts:
    - "vk.com"
    - "vk.ru"
    - "m.vk.com"

color:
  # Минимальное расстояние в пространстве OKLab (чёрный-белый = 1.0) между цветом
  # нового государства и цветами других государств. Формула — Spec 00_core, Часть 3.
  # Подбирается на глаз; меньше значение — разрешены более близкие цвета.
  min_distance_nations: 0.08
  # То же, но до цветов, занятых картой (вода, свободная суша и т. д.).
  min_distance_reserved: 0.08
  # Цвета карты (значения синхронизированы с configs/01_map.yaml, раздел colors;
  # тест сверки лежит в test_configs_validity.py). Названия попадают в текст ошибки.
  reserved:
    - { name: "свободная провинция", hex: "#8C8C8C" }
    - { name: "море", hex: "#141E26" }
    - { name: "земли за краем игрового поля", hex: "#2A2A2A" }
    - { name: "подсветка при наведении", hex: "#FFFFFF" }
  # Готовая палитра для выбора (36 цветов). Схема проверяет, что цвета палитры
  # различимы между собой и с цветами карты с запасом не меньше порогов выше.
  palette:
    - "#6A3446"
    - "#BE1253"
    - "#FD9CBA"
    - "#971D08"
    - "#EA5202"
    - "#D29285"
    - "#FEBB71"
    - "#876114"
    - "#AA8722"
    - "#CCB034"
    - "#385107"
    - "#7FCA23"
    - "#DBE237"
    - "#058D1D"
    - "#478364"
    - "#83B478"
    - "#53DAA5"
    - "#54FC93"
    - "#9EE9D5"
    - "#0A6A75"
    - "#299DAC"
    - "#63CBFE"
    - "#2B2DB0"
    - "#354573"
    - "#615AB5"
    - "#0C7CF4"
    - "#6A0092"
    - "#8A70FC"
    - "#9E8BCF"
    - "#E9C9FE"
    - "#8F0D6A"
    - "#A540BB"
    - "#CC67E3"
    - "#FA90F8"
    - "#97617D"
    - "#F2569C"

images:
  # Картинки государства (версия 0.12.0, единица 5): точный размер флага после пережатия.
  flag_width: 600
  flag_height: 400
  # Точный размер портрета после пережатия.
  portrait_width: 600
  portrait_height: 800
  # Размер миниатюры флага (та же пропорция, что полный размер).
  flag_thumb_width: 96
  flag_thumb_height: 64
  # Размер миниатюры портрета (та же пропорция, что полный размер).
  portrait_thumb_width: 120
  portrait_thumb_height: 160
  # Качество выходного WebP для полного размера и миниатюры.
  webp_quality: 85
  # Жёсткая отсечка тела запроса загрузки, байты (5 МБ).
  max_upload_bytes: 5242880
  # Предел числа пикселей источника, проверяется по заголовку до распаковки.
  max_pixels: 25000000
  # Предел длинной стороны источника, проверяется по заголовку до распаковки.
  max_side: 8000

calendar:
  # Игровая дата = epoch_start_date + (номер хода × months_per_turn) календарных месяцев.
  # Первый ход (счётчик хода 0, в том числе после сброса мира) всегда приходится
  # на январь 2040 года; один ход (одни реальные сутки) равен одному игровому месяцу.
  # День месяца в epoch_start_date обязан быть 1 (проверяет схема).
  epoch_start_date: "2040-01-01"
  months_per_turn: 1
  # Названия месяцев для вывода даты в формате «Месяц Год» (ровно 12,
  # январь первым). Падеж меняется здесь, без правки кода.
  month_names:
    - "январь"
    - "февраль"
    - "март"
    - "апрель"
    - "май"
    - "июнь"
    - "июль"
    - "август"
    - "сентябрь"
    - "октябрь"
    - "ноябрь"
    - "декабрь"
