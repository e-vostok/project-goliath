# Баланс и настройки модуля 01_map (Spec 1.0, Часть 4).
# Валидируется backend/src/modules/_01_map/config_schema.py при старте сервера и в CI.
# Все ключи обязательны; неизвестные ключи запрещены (опечатка ломает запуск).

view:
  frame:                       # рамка предела отдаления в единицах view_box (Spec 3.8, калибровка по картинке Project Owner)
    x: 519.1
    y: 20.9
    width: 221.3
    height: 217.3
  zoom_max: 10.8               # максимальный масштаб относительно минимального (вид рамки по высоте окна)
  pan_margin_fraction: 0.0       # допустимый отступ за край поля при перетаскивании, доля размера окна; 0 = карту нельзя вытянуть за рамку `view.frame`
  label_min_width_px: 48         # подпись узла показывается, если его ширина на экране не меньше, px
  search_min_chars: 2            # минимум символов для запуска поиска по названию
  search_max_results: 20         # максимум результатов в выпадающем списке поиска

refresh:
  tick_refresh_delay_seconds: 5      # пауза после времени смены хода перед запросом состояния, сек
  tick_refresh_jitter_seconds: 30    # случайный разброс запроса, чтобы клиенты не пришли одновременно, сек
  retry_delay_seconds: 10            # пауза перед повтором неудавшегося запроса, сек
  max_retries: 3                     # число повторов подряд до пометки «данные устарели»
  stale_after_seconds: 900           # возраст данных, после которого они помечаются устаревшими при ошибках, сек

colors:
  neutral_province: "#8C8C8C"    # свободная провинция
  sea: "#1E3547"                 # морская зона
  outside: "#2A2A2A"             # земли и неизведанное море за краем игрового поля
  inland_water: "#1E3547"        # озёра рисуются цветом моря (решение Project Owner 04.10.2026); можно вернуть отличие, изменив только это значение
  province_border: "#3A3A3A"     # границы провинций (запасной стиль, если слой borders не загрузился)
  land_underlay: "#8C8C8C"       # подложка под заливки суши (map2_13): волосяные швы между соседями показывают цвет суши, а не моря; близко к цвету свободной провинции
  hover: "#FFFFFF"               # цвет заливки при наведении и при выборе

hover:
  fill_opacity: 0.14             # прозрачность заливки colors.hover при наведении на узел (0 = без заливки)
  stroke_enabled: false          # обводить ли контур узла при наведении (true = линия colors.hover)

borders:                          # слой границ из borders.json (map2_4); ширины — экранные px при любом зуме
  internal_width: 0.8             # толщина сплошной линии между провинциями одного государства / свободных (map2_13), px
  internal_opacity: 0.45          # прозрачность внутренних границ
  internal_color: "#4A4A4A"       # цвет внутренних границ (средне-тёмный нейтральный серый: читается и на сером свободном, и на цветах государств)
  state_width: 1.8                # толщина сплошной линии границы государства (только по суше), px
  state_color: "#101014"          # цвет границы государства (почти чёрный)
  coast_width: 0.9                # толщина тонкой линии берега у всех провинций, px
  coast_color: "#24262B"          # цвет линии берега (тёмно-нейтральный)

selection:                        # подсветка выбора: белая заливка colors.hover (map2_4)
  pulse_min_opacity: 0.10         # нижняя прозрачность пульсации осматриваемой провинции
  pulse_max_opacity: 0.32         # верхняя прозрачность пульсации (>= min)
  pulse_period_s: 2.4             # период пульсации, сек
  picked_opacity: 0.28            # постоянная прозрачность отобранных в пикере провинций

strait:
  default_crossing_multiplier: 0.5   # доля обычной проходимости при переправе через узкий пролив, (0.05..1.0]

relief:                             # подложка рельефа под картой (map2_5); картинка печётся tools/map_pipeline/build_relief.py
  enabled: true                     # слой включён; false или ошибка загрузки — карта выглядит как раньше
  margin_units: 12                  # запас картинки за рамку view.frame на каждую сторону, ед. view_box (1..40)
  strength_playable: 0.55           # сила просвечивания рельефа сквозь заливки провинций — режим multiply (0..1)
  inactive_opacity: 0.45            # прозрачность приглушающей заливки неигровой суши (0..1)
  inactive_tint: "#3D4A58"          # цвет приглушения неигровой суши: нейтральный серо-синий, к цвету моря
  edge_fade_units: 6                # мягкий спад картинки к цвету моря у её края, ед. view_box (0..20)

starting_group:
  require_connected: true        # стартовая группа провинций обязана быть связной (Bible §6)

big_window:
  enabled: true                  # кнопка «Развернуть» (полноэкранный режим страницы, проверено в ВК в E1); false скрывает кнопку

limits:
  max_nodes: 3000                # защита от подмены файла карты: максимум узлов в manifest
  max_edges_per_node: 60         # защита: максимум связей у одного узла (у Северного моря 41 связь)
  max_geometry_bytes: 5000000    # защита: максимальный размер файла геометрии, байт
  max_manifest_bytes: 3000000    # защита: максимальный размер manifest, байт
  max_borders_bytes: 2000000     # защита: максимальный размер файла границ (map2_1B), байт

attribution:
  text: "Карта: MapChart.net, лицензия CC BY-SA 4.0"   # строка авторства в клиенте
