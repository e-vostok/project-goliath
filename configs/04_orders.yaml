# Баланс и настройки модуля 04_orders («Приказы») — Spec 04_orders, Часть 4.
# Валидируется backend/src/modules/_04_orders/config_schema.py при старте сервера и в CI
# (pytest tests/test_configs_validity.py). Все ключи обязательны; неизвестные ключи
# запрещены (опечатка ломает запуск, а не молча игнорируется).
#
# Тексты уведомлений бота лежат не здесь, а в configs/02_bot.yaml (раздел types):
# Spec 04_orders, Приложение C.
#
# Изменение вступает в силу после деплоя (конфиг читается при запуске сервера).
# Срок и напоминание фиксируются в приказе в момент назначения судьи: правка этих
# значений не меняет уже назначенные приказы.

judge:
  min_rating: 0                  # порог судейского рейтинга: судья имеет рейтинг не ниже этого числа (−100…100); на время тестов 0
  max_pending_verdicts: 5        # предел приказов, ожидающих вердикта, у одного судьи
  require_reachable: true        # судьёй может стать только тот, кто увидит приказ: владелец государства или игрок с согласием на сообщения бота; false — любой игрок
  verdict_deadline_hours: 72     # срок на вердикт с момента назначения, часы (предложение Lead; подтверждает Project Owner)
  reminder_percent: 75           # напоминание судье, когда прошла эта доля срока, % (10…95)

author:
  max_unresolved_orders: 5       # предел приказов без вердикта у одного автора (ожидающих судью, распределённых и просроченных); вердикт освобождает место

distribution:
  retry_interval_seconds: 60     # период фоновой задачи: повтор распределения и напоминания, сек
  batch_size: 50                 # сколько приказов без судьи обрабатывается за один проход

limits:
  title_min_length: 3            # название приказа и вердикта, символы
  title_max_length: 100
  summary_min_length: 10         # краткая суть приказа и вердикта, символы
  summary_max_length: 500
  url_max_length: 200            # ссылка на статью ВК, символы; домены — как history_url в 00_core
