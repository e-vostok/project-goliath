[project]
name = "project-goliath-backend"
version = "0.8.9"
description = "Backend for Project Goliath - Turn-based strategy game"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.12.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.8.0",
    "tzdata>=2024.1",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "polyfactory>=2.0.0",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# pg fixtures are imported for registration, then shadowed by test params/local fixtures
"tests/**/*_pg.py" = ["F811"]
"tests/**/test_postgres_e2e.py" = ["F811"]
"tests/**/test_e2e_acceptance.py" = ["F811"]
"tests/**/test_e2e_flow.py" = ["F811"]
"tests/**/conftest.py" = ["F811"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "postgres: destructive end-to-end tests against a real PostgreSQL database (require DATABASE_URL_TEST, wipe the target schema)",
]

[tool.vulture]
paths = ["src"]
min_confidence = 80
