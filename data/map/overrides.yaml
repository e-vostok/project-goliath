# Крупные водоёмы, которые сознательно не становятся морскими зонами (за краем поля): остаются частью «неизведанного» фона. Точка задаёт водоём целиком.
water_outside:
  - {name: "Аральское море", point: [761.88, 163.88]}
  - {name: "Красное море", point: [687.38, 259.38]}
  - {name: "Персидский залив", point: [727.38, 235.12]}

# Безымянные водоёмы (связные участки воды целиком, не только внутри полосы) площадью меньше этого порога, кв. ед. SVG, — внутренняя вода (озёра, Ладожское, Онежское, Венерн, Пейпус и т.п.): не узлы, не суша, в граф не входят, показываются фоном цвета colors.inland_water.
lake_max_area: 70

# Ложные автосвязи, которые нужно убрать (заполняется по итогам первого прогона MP-2).
edges_remove: []

# Мусорные контуры исходника, исключаемые из карты (ключи в нижнем регистре). Контура, которого нет в boundary.yaml, это не касается (инструмент только сообщает).
technical_exclude: [danish_sea]

# Обособленные куски игровых провинций внутри исключённой зоны, сознательно оставленные (сейчас таких нет).
keep_parts: []

# Русские названия узлов; необязательны, при отсутствии показывается название из источника.
names_ru: {}
