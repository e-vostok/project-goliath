# data/map/overrides.yaml — ручные данные карты (вход инструмента tools/map_pipeline). Утверждено Project Owner 01.10.2026; правка 01.10.2026: Персидский залив добавлен в water_outside, озёра — внутренняя вода.
# Координаты (x, y) — в базовом пространстве исходного SVG (1200x680). В комментариях: долгота/широта для людей.
# Номера зон (№) совпадают с номерами на картинке sea_zones_overview.png; номера проливов (П) — с красными линиями на ней.
# Формат описан в docs/02_SYSTEM_SPECS/01_map.md (Часть 1, версия 1.2). Номера зон (№) и проливов (П) соответствуют картинке предпросмотра.

# Ширина морской полосы вдоль игровой суши, в единицах SVG (1 единица ≈ 23 км, значит 30 ≈ 700 км). Вода дальше этого расстояния от игровых провинций — «неизведанное море» за краем поля, не узлы.
sea_margin: 30
# Форма границы: square — квадратная (расстояние считается по большей из двух осей, края идут по сторонам света); round — круглая (обычное расстояние).
sea_margin_shape: square
# Сглаживание мелких выемок границы, в единицах SVG (0 — без сглаживания).
sea_margin_smooth: 10

# Обособленные куски игровых провинций, лежащие внутри исключённой зоны (их соседи — только исключённые провинции). Исключаются из геометрии; провинция остаётся без них.
drop_parts:
  - {key: kemi_lappmark, point: [643.58, 32.88]}   # обособленный кусок внутри Финнмарка (около 24E 70N), 6.91 кв. ед.

